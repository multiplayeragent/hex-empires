<script type="module">
/* ═══ HEX EMPIRES · a Multiplayer Agent starter ═══════════════════════════════════════════
 * A mini 4X on a seeded hex island: claim land, gather food, wood and stone, build farms and
 * towers, train soldiers and catapults, take the rivals' castles. Turn-based, 2–4 players;
 * bots rule the empty empires. About 15 minutes a match.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ island size, rounds, timers, costs, units, castle and tower strength, colors
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   MAP ........... hex maths, the seeded island (terrain + castle spots), tile lookups
 *   RULES ......... every action (claim, farm, tower, train, move, attack, end turn) as one
 *                   function that checks it and returns the new game, or null if it's not allowed
 *   BOT ........... how a bot ruler picks its next action
 *   GAME (HOST) ... seats, bot turns, the turn timer, the end. Only the host writes `game`.
 *   SCENE ......... renderer, lights, the sea, the hex tiles, trees, rocks and mountains
 *   MODELS ........ territory tint and borders, farms, towers, castles, soldiers, catapults
 *   VIEW .......... turning `game` into the scene: walking, fighting, building, particles
 *   MY TURN ....... selecting tiles and units, the markers, sending actions
 *   HUD & RESULTS . chips, status, the action panel, the results card, leaderboard, sounds
 *   INPUT / LOOP .. taps and keys, the camera, the main loop
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - The whole match lives in ONE shared field, `game`: {id, v, seed, seats, turn, round, tt,
 *     t, o, b, u, hp, res, out, nid, phase, win, why, at, endsAt, last}. `seed` grows the same
 *     island on every screen; `o` (owner) and `b` (building) are one letter per tile; `u` lists
 *     the units [id, seat, kind, tile, hp, moves left, can attack]. Only the HOST writes it and
 *     `v` goes up on every write.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. It checks every action with the RULES, plays the bot empires one
 *     action at a time, ends a turn when its timer runs out and decides the winner. A new host
 *     carries on from `game`: same island, same turn, same timer.
 *   - Each player writes its OWN entity: `n` (name), `c` (color), `hb` (heartbeat).
 *   - Players send intents to the host: "act" {g, tt, a} where a = {k: "claim"|"farm"|"tower"|
 *     "train"|"move"|"attack"|"end", ...} and `tt` counts turns, so an action sent in the
 *     previous turn is ignored; "again" {g} after a match. The host applies its own directly.
 *   - Everyone animates from `last` (the latest action: who walked where, who hit whom).
 *   - Players take empires as they arrive; anyone past four watches. An empire whose player is
 *     silent for 12s goes to a bot; a waiting player takes over a bot's empire, even mid-match.
 *   - ?attract plays offline, four bots, starting a few rounds in (the preview is recorded from it).
 *   - Leaderboard "wins": +1 for each match a player wins, shown on the results card.
 */
import * as THREE from "three";

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  radius: 5,               // island size in hexes from the centre to the open sea (5 = 91 hexes)
  rounds: 16,              // after this many rounds the biggest empire wins (about 15 minutes)
  turnMs: 45000,           // a player's turn ends by itself after this long
  botStepMs: 450,          // a bot waits this long between actions, so you can follow it
  stepMs: 170,             // a unit takes this long to walk one hex
  start: [4, 3, 2],        // food, wood, stone each empire starts with
  castleYield: [2, 1, 1],  // a castle makes this every turn, on top of its land
  farmFood: 2,             // extra food from a farm (its grass makes 1 as well)
  // [food, wood, stone]
  cost: { claim: [2, 0, 0], farm: [0, 2, 0], tower: [0, 2, 3], soldier: [3, 1, 0], catapult: [1, 2, 2] },
  // atk = damage per attack; siege = extra damage against towers and castles
  units: [
    { name: "Soldier", hp: 3, atk: 3, move: 2, range: 1, siege: 0 },
    { name: "Catapult", hp: 2, atk: 1, move: 1, range: 2, siege: 3 },
  ],
  maxUnits: 6,             // units per empire
  castleHp: 6, towerHp: 4,
  castleHeal: 1,           // a damaged castle mends this much each turn
  guardShot: 1,            // towers and castles hit each enemy unit next to them this hard, every turn
  seatGraceMs: 12000,      // a player silent this long hands the empire to a bot
  resultsMs: 40000,        // results show this long, then a new match starts
  board: "wins",           // leaderboard name
  seatColors: ["#e5484d", "#3a86ff", "#f5b82e", "#a061e8"],
  seatNames: ["Red", "Blue", "Gold", "Violet"],
  botNames: ["Queen Ruby", "King Azure", "Duke Amber", "Lady Iris"],
  sea: "#1d5f8f", sky: "#173450",
};
const COLORS = ["#ff6b6b", "#4dabf7", "#ffd43b", "#69db7c", "#b197fc", "#ff922b", "#f783ac", "#3bc9db"];
const NAME_A = ["Bold", "Wise", "Brave", "Clever", "Grand", "Lucky"], NAME_B = ["Builder", "Ruler", "Settler", "Baron", "Chief", "Mayor"];
const SEAT_PICK = [0, 2, 1, 3]; // the second player starts across the island from the first
const ICON = ["🌾", "🪵", "🪨"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'hex-empires',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map(); // sessionId -> { hb, at } on OUR clock
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
const isHost = () => livePlayers()[0] === net.sessionId;
/** Still in the room and heard from within the seat grace time (a backgrounded phone keeps its seat). */
const stillHere = (id) => id === net.sessionId || (!!S.entities.players[id] && performance.now() - (seenHb.get(id)?.at ?? -1e9) < CONFIG.seatGraceMs);

// ── MAP ─────────────────────────────────────────────────────────────────────────────
// Pointy-top hexes in axial coordinates (q, r). World: x = √3·(q + r/2), z = 1.5·r, one unit = hex radius.
const R = CONFIG.radius, SQ3 = Math.sqrt(3);
const TILES = [];
for (let q = -R; q <= R; q++) for (let r = Math.max(-R, -q - R); r <= Math.min(R, -q + R); r++) TILES.push({ q, r, x: SQ3 * (q + r / 2), z: 1.5 * r });
const INDEX = new Map(TILES.map((t, i) => [t.q + "," + t.r, i]));
const tileAt = (q, r) => INDEX.get(q + "," + r) ?? -1;
const DIRS = [[0, 1], [1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1]]; // edge i of a hex faces DIRS[i]
const NEIGH = TILES.map((t) => DIRS.map(([dq, dr]) => tileAt(t.q + dq, t.r + dr)));
const hexDist = (a, b) => { const A = TILES[a], B = TILES[b]; return (Math.abs(A.q - B.q) + Math.abs(A.r - B.r) + Math.abs(A.q + A.r - B.q - B.r)) / 2; };
const CENTER = tileAt(0, 0);
const TERRAIN = {
  g: { name: "Grass", color: "#88c95a", h: 0.3, yield: [1, 0, 0] },
  f: { name: "Forest", color: "#4f9548", h: 0.34, yield: [0, 1, 0] },
  h: { name: "Hills", color: "#c4a676", h: 0.5, yield: [0, 0, 1] },
  m: { name: "Mountain", color: "#8e909c", h: 0.62, yield: [0, 0, 0] },
  w: { name: "Sea", color: CONFIG.sea, h: 0, yield: [0, 0, 0] },
};
const walkable = (t) => t === "g" || t === "f" || t === "h";
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const maps = new Map();
/** The island for a seed: terrain letter per tile, the four castle tiles, a little jitter for looks. Same seed, same island, everywhere. */
function mapOf(seed) {
  if (maps.has(seed)) return maps.get(seed);
  const rnd = mulberry32(seed), n = TILES.length;
  const smooth = (a) => a.map((v, i) => { const nb = NEIGH[i].filter((j) => j >= 0); return (v + nb.reduce((s, j) => s + a[j], 0)) / (nb.length + 1); });
  const hgt = smooth(smooth(TILES.map(() => rnd()))), wet = smooth(smooth(TILES.map(() => rnd()))), coast = smooth(TILES.map(() => rnd()));
  const terr = TILES.map((_, i) => (hexDist(i, CENTER) <= R - 0.6 + (coast[i] - 0.5) * 3.2 ? "g" : "w"));
  const land = TILES.map((_, i) => i).filter((i) => terr[i] !== "w");
  const byH = land.slice().sort((a, b) => hgt[b] - hgt[a]);
  byH.slice(0, Math.round(land.length * 0.06)).forEach((i) => (terr[i] = "m"));
  byH.slice(Math.round(land.length * 0.06), Math.round(land.length * 0.27)).forEach((i) => (terr[i] = "h"));
  land.filter((i) => terr[i] === "g").sort((a, b) => wet[b] - wet[a]).slice(0, Math.round(land.length * 0.3)).forEach((i) => (terr[i] = "f"));
  // Castles near the four diagonal corners, each with grass, a forest and a hill next door.
  const caps = [-135, -45, 45, 135].map((deg) => {
    const a = (deg * Math.PI) / 180, px = Math.cos(a) * (R - 1.6) * SQ3, pz = Math.sin(a) * (R - 1.6) * SQ3;
    let best = 0, bd = Infinity;
    TILES.forEach((t, i) => { const d = Math.hypot(t.x - px, t.z - pz); if (d < bd && hexDist(i, CENTER) <= R - 1) { bd = d; best = i; } });
    return best;
  });
  for (const c of caps) {
    terr[c] = "g";
    NEIGH[c].forEach((j, k) => { if (j >= 0) terr[j] = k === 0 ? "f" : k === 3 ? "h" : terr[j] === "w" || terr[j] === "m" ? "g" : terr[j]; });
  }
  const m = { terr, caps, jit: TILES.map(() => rnd()) };
  maps.set(seed, m);
  return m;
}
const CH = "abcd"; // the owner letters in `o`: seat 0 = "a" ... "-" = nobody
const ownerOf = (x, i) => CH.indexOf(x.o[i]);
const unitOn = (x, t) => x.u.find((u) => u[3] === t);
const myUnits = (x, s) => x.u.filter((u) => u[1] === s);
const afford = (res, c) => res[0] >= c[0] && res[1] >= c[1] && res[2] >= c[2];
const isGuard = (b) => b === "t" || b === "c"; // towers and castles: they shoot, they can't be walked into by enemies

// ── RULES ───────────────────────────────────────────────────────────────────────────
/** A copy of the game we can change: tiles as arrays, units and resources copied. */
function editable(g) { return { ...g, o: g.o.split(""), b: g.b.split(""), u: g.u.map((u) => u.slice()), res: g.res.map((r) => r.slice()), hp: { ...g.hp }, out: g.out.slice() }; }
const packed = (x) => ({ ...x, o: x.o.join(""), b: x.b.join("") });
/** Read-only tile arrays for a game (cached per game object). */
const views = new WeakMap();
function look(g) { let x = views.get(g); if (!x) { x = { ...g, o: g.o.split(""), b: g.b.split("") }; views.set(g, x); } return x; }

const canClaim = (x, s, t) => t >= 0 && walkable(mapOf(x.seed).terr[t]) && x.o[t] === "-" && NEIGH[t].some((j) => j >= 0 && ownerOf(x, j) === s);
/** Where a unit can walk this turn: tile -> path. Not through units, the sea, mountains, or enemy towers and castles. */
function reachable(x, u) {
  const out = new Map(), terr = mapOf(x.seed).terr;
  let front = [[u[3], []]];
  const seen = new Set([u[3]]);
  for (let step = 0; step < u[5]; step++) {
    const next = [];
    for (const [t, path] of front) for (const j of NEIGH[t]) {
      if (j < 0 || seen.has(j) || !walkable(terr[j]) || unitOn(x, j)) continue;
      const own = ownerOf(x, j);
      if (own >= 0 && own !== u[1] && isGuard(x.b[j])) continue;
      seen.add(j); const p = [...path, j]; out.set(j, p); next.push([j, p]);
    }
    front = next;
  }
  return out;
}
/** What a unit can hit right now: tiles in range with an enemy unit, tower or castle. */
function targetsOf(x, u) {
  if (!u[6]) return [];
  const out = [], range = CONFIG.units[u[2]].range;
  for (let t = 0; t < TILES.length; t++) {
    const d = hexDist(u[3], t);
    if (d < 1 || d > range) continue;
    const e = unitOn(x, t), own = ownerOf(x, t);
    if ((e && e[1] !== u[1]) || (own >= 0 && own !== u[1] && isGuard(x.b[t]))) out.push(t);
  }
  return out;
}
const score = (x, s) => x.o.reduce((n, c, i) => n + (c === CH[s] ? 1 + (x.b[i] === "c" ? 5 : x.b[i] !== "-" ? 2 : 0) : 0), 0) + myUnits(x, s).length;
/** The resources seat s makes each turn. */
function income(x, s) {
  const terr = mapOf(x.seed).terr, inc = [0, 0, 0];
  x.o.forEach((c, i) => {
    if (c !== CH[s]) return;
    TERRAIN[terr[i]].yield.forEach((v, k) => (inc[k] += v));
    if (x.b[i] === "f") inc[0] += CONFIG.farmFood;
    if (x.b[i] === "c") CONFIG.castleYield.forEach((v, k) => (inc[k] += v));
  });
  return inc;
}
/** A castle fell: its empire is out, and all its land (farms and towers too) goes to the winner. */
function fall(x, loser, winner, t) {
  x.b[t] = "-"; delete x.hp[t];
  x.o = x.o.map((c) => (c === CH[loser] ? CH[winner] : c));
  x.u = x.u.filter((u) => u[1] !== loser);
  x.res[loser] = [0, 0, 0]; x.out[loser] = 1;
}
function finish(x, win, why) { Object.assign(x, { phase: "over", win, why, endsAt: Date.now() + CONFIG.resultsMs }); }
/** Begin seat s's turn: income, fresh units, towers and castles shoot their neighbours, castles mend. */
function startTurn(x, s) {
  const inc = income(x, s), shots = [];
  x.turn = s; x.tt++; x.acts = 0;
  x.res[s] = x.res[s].map((v, k) => Math.min(99, v + inc[k]));
  for (const u of x.u) if (u[1] === s) { u[5] = CONFIG.units[u[2]].move; u[6] = 1; }
  x.b.forEach((b, t) => {
    if (!isGuard(b) || ownerOf(x, t) !== s) return;
    for (const j of NEIGH[t]) { const e = j >= 0 && unitOn(x, j); if (e && e[1] !== s) { e[4] -= CONFIG.guardShot; shots.push([t, j, e[4] <= 0 ? 1 : 0]); } }
    if (b === "c" && x.hp[t]) { x.hp[t] = Math.min(CONFIG.castleHp, x.hp[t] + CONFIG.castleHeal); if (x.hp[t] >= CONFIG.castleHp) delete x.hp[t]; }
  });
  x.u = x.u.filter((u) => u[4] > 0);
  const now = Date.now();
  x.endsAt = now + CONFIG.turnMs; x.at = now + (shots.length ? 700 : 300);
  x.last = { n: x.last.n + 1, k: "turn", s, shots, inc };
}
function endTurn(x) {
  let next = x.turn;

    : (bot ? `${who} is planning…` : `${who}'s turn · ${secs}s`) + (me < 0 ? " · you're watching" : g.out[me] ? " · your castle fell" : "");
  panel(g, me, x);
  if (g.phase === "over" && resultsFor !== g.id) showResults(g, me);
  $("over").hidden = g.phase !== "over" || closedFor === g.id;
  const n = livePlayers().length;
  $("net").textContent = net.offline ? "Offline: playing with bots" : dropped ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the game" : ""}`;
}
/** The bottom panel: my resources, what the selected hex is, and what I can do there. */
function panel(g, me, x) {
  const p = $("panel");
  p.hidden = me < 0 || (g.phase === "over" && closedFor !== g.id);
  if (p.hidden) return;
  const res = g.res[me], inc = income(x, me), mine = myTurn(g), t = sel.tile, terr = mapOf(g.seed).terr;
  const btns = [];
  let info = mine ? "Tap a hex: gold = land to claim, your castle = train units, your units = move" : "Waiting for your turn…";
  if (g.phase === "over") { info = "The match is over."; btns.push(["again", "Play again", null]); }
  else if (t >= 0) {
    const own = ownerOf(x, t), u = unitOn(x, t), b = x.b[t], T = TERRAIN[terr[t]];
    const parts = [T.name + (T.yield.some(Boolean) ? ` (+1${ICON[T.yield.indexOf(1)]})` : ""), own < 0 ? "free" : own === me ? "yours" : nameOf(g, own) + "'s"];
    if (b !== "-") parts.push({ f: "Farm (+2🌾)", t: `Tower ${g.hp[t] ?? CONFIG.towerHp}/${CONFIG.towerHp}`, c: `Castle ${g.hp[t] ?? CONFIG.castleHp}/${CONFIG.castleHp}` }[b]);
    if (u) parts.push(`${u[1] === me ? "your" : nameOf(g, u[1]) + "'s"} ${CONFIG.units[u[2]].name.toLowerCase()} ${u[4]}/${CONFIG.units[u[2]].hp}`);
    info = parts.join(" · ");
    if (mine) {
      if (u && u[1] === me) info += u[5] > 0 || u[6] > 0 ? " · tap blue to walk, red to attack" : " · done this turn";
      if (canClaim(x, me, t)) btns.push(["claim", "Claim", CONFIG.cost.claim]);
      if (own === me && b === "-" && terr[t] === "g") btns.push(["farm", "Farm", CONFIG.cost.farm]);
      if (own === me && b === "-") btns.push(["tower", "Tower", CONFIG.cost.tower]);
      if (own === me && b === "c" && !u && myUnits(x, me).length < CONFIG.maxUnits) { btns.push(["soldier", "Soldier", CONFIG.cost.soldier]); btns.push(["catapult", "Catapult", CONFIG.cost.catapult]); }
    }
  }
  if (mine) btns.push(["end", "End turn", null]);
  const ready = mine && x.u.some((u) => u[1] === me && (u[5] > 0 || u[6] > 0));
  const key = JSON.stringify([res, inc, g.round, info, btns.map((b) => b[0] + (b[2] ? afford(res, b[2]) : "")), ready]);
  if (key === panelKey) return;
  panelKey = key;
  $("res").innerHTML = res.map((v, k) => `<span>${ICON[k]} ${v}<small>+${inc[k]}</small></span>`).join("") + `<span class="rd">Round ${Math.min(g.round, CONFIG.rounds)}/${CONFIG.rounds}</span>`;
  $("info").textContent = info;
  $("acts").innerHTML = btns.map(([a, label, c]) => a === "end" ? `<button id="end" data-a="end" class="${ready ? "" : "pulse"}">End turn</button>`
    : `<button data-a="${a}"${c && !afford(res, c) ? " disabled" : ""}>${label}${c ? `<small>${costText(c)}</small>` : ""}</button>`).join("");
}
$("acts").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  const a = b.dataset.a, t = sel.tile;
  if (a === "again") return playAgain();
  if (a === "end") { sel.tile = -1; return act({ k: "end" }); }
  if (a === "soldier" || a === "catapult") return act({ k: "train", tile: t, kind: a === "catapult" ? 1 : 0 });
  act({ k: a, tile: t });
});
function showResults(g, me) {
  resultsFor = g.id;
  const won = me >= 0 && g.win === me, x = look(g);
  $("overTitle").textContent = won ? "You win!" : `${nameOf(g, g.win)} wins`;
  $("overWhy").textContent = g.why + ".";
  const order = [0, 1, 2, 3].sort((a, b) => (b === g.win) - (a === g.win) || (g.out[a] - g.out[b]) || score(x, b) - score(x, a));
  $("standings").innerHTML = order.map((s) => `<li><i class="sq" style="background:${CONFIG.seatColors[s]}"></i>${esc(nameOf(g, s))}${s === me ? " (you)" : ""}<span>${g.out[s] ? "castle fell" : score(x, s) + " pts"}</span></li>`).join("");
  $("again").classList.toggle("hide", me < 0);
  sound(won ? "win" : "boom");
  const list = $("board");
  if (!board) { list.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li>Loading…</li>";
  (won ? board.submit(1, "inc").catch(() => null) : Promise.resolve()).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score}</span></li>`).join("") : "<li>No wins yet. Be the first.</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}
function playAgain() { const g = game(); if (!g || g.phase !== "over") return; const msg = { g: g.id }; if (isHost()) hostAgain(net.sessionId, msg); else net.send("again", msg); }
$("again").onclick = playAgain;
$("look").onclick = () => { closedFor = game()?.id ?? -1; };
let actx = null; // sounds start after the first tap or key (browsers require it)
const wake = () => { if (!actx) try { actx = new AudioContext(); } catch {} };
addEventListener("pointerdown", wake); addEventListener("keydown", wake);
function tone(f0, f1, ms, type = "triangle", vol = 0.14, delay = 0) {
  const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + ms / 1000);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + ms / 1000);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + ms / 1000 + 0.05);
}
function sound(kind) {
  if (!actx || ATTRACT) return;
  if (kind === "claim") tone(520, 780, 120, "triangle", 0.12);
  else if (kind === "build") { tone(180, 120, 140, "square", 0.08); tone(240, 160, 140, "square", 0.06, 0.12); }
  else if (kind === "train") [392, 523].forEach((f, i) => tone(f, f, 150, "sawtooth", 0.06, i * 0.1));
  else if (kind === "step") tone(300, 220, 60, "sine", 0.06);
  else if (kind === "hit") tone(260, 70, 220, "sawtooth", 0.12);
  else if (kind === "boom") { tone(160, 40, 500, "sawtooth", 0.16); tone(700, 120, 260, "square", 0.05); }
  else if (kind === "turn") tone(660, 990, 180, "sine", 0.1);
  else if (kind === "win") [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 260, "triangle", 0.16, i * 0.12));
}

// ── INPUT / LOOP ────────────────────────────────────────────────────────────────────
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), ground = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.45), hit = new THREE.Vector3();
/** The hex under a screen point (through the camera that drew the frame), or -1. */
function hexAt(px, py) {
  ndc.set((px / innerWidth) * 2 - 1, -(py / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (!ray.ray.intersectPlane(ground, hit)) return -1;
  const fq = (SQ3 / 3) * hit.x - hit.z / 3, fr = (2 / 3) * hit.z, fs = -fq - fr;
  let q = Math.round(fq), r = Math.round(fr); const s = Math.round(fs);
  const dq = Math.abs(q - fq), dr = Math.abs(r - fr), ds = Math.abs(s - fs);
  if (dq > dr && dq > ds) q = -r - s; else if (dr > ds) r = -q - s;
  return tileAt(q, r);
}
renderer.domElement.addEventListener("pointerdown", (e) => { e.preventDefault(); tapTile(hexAt(e.clientX, e.clientY)); });
addEventListener("keydown", (e) => {
  if (e.key === "Escape") sel.tile = -1;
  if (e.key === "Enter" || e.key === "e") { const g = game(); if (g && myTurn(g)) { sel.tile = -1; act({ k: "end" }); } }
});
document.addEventListener("touchmove", (e) => { if (!e.target.closest(".card")) e.preventDefault(); }, { passive: false });

/** The camera sits behind your castle and backs off until the island fits between the HUD and the panel. */
const camAt = new THREE.Vector3(), camGoal = new THREE.Vector3();
let camAngle = 0;
function aimCamera(dt, g, now) {
  const portrait = innerHeight > innerWidth, elev = ATTRACT ? 0.8 : portrait ? 1.28 : 0.95;
  let want = 0;
  if (g) { const s = mySeat(g), cap = mapOf(g.seed).caps[s >= 0 ? s : 0]; want = Math.atan2(TILES[cap].x, TILES[cap].z); }
  if (ATTRACT) want = 0.4 + now / 16000;
  camAngle += Math.atan2(Math.sin(want - camAngle), Math.cos(want - camAngle)) * Math.min(1, dt * (ATTRACT ? 10 : 2.5));
  const top = ATTRACT ? 0 : $("top").offsetHeight + 14, bottom = ATTRACT ? 0 : ($("panel").hidden ? 30 : $("panel").offsetHeight + 30);
  const avail = Math.max(120, innerHeight - top - bottom), vf = THREE.MathUtils.degToRad(camera.fov) / 2, hf = Math.atan(Math.tan(vf) * camera.aspect);
  const vEff = Math.atan((Math.tan(vf) * avail) / innerHeight), hEff = Math.atan(Math.tan(hf) * 0.96), B = R * SQ3 + 0.6;
  const dist = ATTRACT ? 14.5 : Math.max((B * Math.sin(elev)) / Math.tan(vEff), B / Math.tan(hEff)) + B * Math.cos(elev);
  scene.fog.near = dist * 1.2; scene.fog.far = dist * 3;
  camera.setViewOffset(innerWidth, innerHeight, 0, -((top + innerHeight - bottom) / 2 - innerHeight / 2), innerWidth, innerHeight);
  camGoal.set(Math.sin(camAngle) * Math.cos(elev) * dist, Math.sin(elev) * dist, Math.cos(camAngle) * Math.cos(elev) * dist);
  if (!camAt.lengthSq()) camAt.copy(camGoal);
  camAt.lerp(camGoal, Math.min(1, dt * 4));
  camera.position.copy(camAt); camera.lookAt(0, ATTRACT ? -1 : 0, 0);
}

let myName = "", myColor = COLORS[0], last = performance.now(), lastHb = 0, lastHud = 0;
try { myName = localStorage.getItem("mpa-name") || ""; } catch {}
const pickOne = (list) => list[Math.floor(Math.random() * list.length)];
if (!myName) { myName = pickOne(NAME_A) + " " + pickOne(NAME_B); try { localStorage.setItem("mpa-name", myName); } catch {} }
if (ATTRACT) { Object.assign(CONFIG, { botStepMs: 170, stepMs: 120, resultsMs: 2500 }); $("net").textContent = ""; }
/** Two people joined at once with one color: the one with the higher sessionId picks a free one. (Bots show their empire color, never these.) */
function fixColor() {
  const others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId);
  if (!others.some(([id, p]) => p.c === myColor && id < net.sessionId)) return;
  const taken = new Set(others.map(([, p]) => p.c)), free = COLORS.find((c) => !taken.has(c));
  if (free) { myColor = free; net.me.set("c", free); }
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick();
  const g = game();
  if (g) {
    syncWorld(g, now);
    if (sel.tile >= 0 && g.phase !== "play") sel.tile = -1;
    showMarks(g, now);
    tickWorld(g, now, dt);
    if (now - lastHud > 100) { lastHud = now; hud(g); }
  }
  partsTick(dt); shotsTick(now); popsTick(dt);
  aimCamera(dt, g, now);
  renderer.render(scene, camera);
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("act", (m, from) => { if (isHost() && m) hostAct(from, m); });
  net.on("again", (m, from) => { if (isHost() && m) hostAgain(from, m); });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const takenColors = new Set(Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c));
  myColor = COLORS.find((c) => !takenColors.has(c)) || pickOne(COLORS);
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  requestAnimationFrame(frame);
})();
